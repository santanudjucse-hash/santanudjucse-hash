<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <style>
      .header { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 13px; fill: #8b949e; }
      .prompt { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #58a6ff; }
      .cmd { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 14px; fill: #e6edf3; }
      .key { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #bc8cff; }
      .val { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 13px; fill: #7ee787; }
      .str { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 13px; fill: #a5d6ff; }
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 26px; font-weight: 800; fill: url(#accentGrad); }
      .sub { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="800" height="220" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Control Buttons -->
  <circle cx="25" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="45" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="20" r="6" fill="#27c93f"/>
  <text x="400" y="24" text-anchor="middle" class="header">santanu@dashboard:~</text>

  <line x1="0" y1="38" x2="800" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Content -->
  <g transform="translate(25, 65)">
    <text x="0" y="0" class="prompt">➜  <tspan class="cmd">whoami --verbose</tspan></text>
    
    <g transform="translate(10, 30)">
      <text x="0" y="0" class="title">Santanu Das</text>
      <text x="0" y="24" class="sub">Full-Stack Engineer &amp; Software Architect | Open Source Enthusiast</text>
      
      <text x="0" y="60" class="key">Location: <tspan class="str">"Global / Remote"</tspan></text>
      <text x="240" y="60" class="key">Focus: <tspan class="val">["Web Apps", "Distributed Systems", "AI Tools"]</tspan></text>
      <text x="0" y="85" class="key">Status: <tspan class="val">"Building scalable &amp; beautiful digital experiences 🚀"</tspan></text>
    </g>
  </g>
</svg>
